<!DOCTYPE html>
<html lang="zh-CN">
<!--

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勇者之路：村庄毁灭的救赎</title>
  <link rel="stylesheet" href="./assets/css/font-awesome@6.4.0.css">
  <link rel="stylesheet" href="./assets/css/rpgGame.css">
  <script src="./utils/rpgGame.js"></script>
  <script src="./assets//data/game.all.configs.js"></script>
  <script src="./assets//data/game.all.enemies.js"></script>
  <script src="./assets//data/game.all.equips.js"></script>
  <script src="./assets//data/game.all.items.js"></script>
  <script src="./assets//data/game.all.skills.js"></script>
  <script src="./assets//data/game.all.status.js"></script>
</head>

<body>
  <div class="container">
    <div class="game-area">
      <div class="game-header">
        <h1 class="game-title">勇者之路：村庄毁灭的救赎</h1>
        <p class="game-subtitle">你的村庄被摧毁了，赶往国都击败路边王，拯救这片土地！</p>
        <div class="save-controls">
          <button id="save-btn" class="save-btn">
            <i class="fas fa-save"></i>保存游戏
          </button>
          <button id="load-btn" class="save-btn">
            <i class="fas fa-folder-open"></i>加载游戏
          </button>
          <button id="export-btn" class="save-btn">
            <i class="fas fa-file-export"></i>导出存档
          </button>
          <button id="import-btn" class="save-btn">
            <i class="fas fa-file-import"></i>导入存档
          </button>
          <button id="copy-save-btn" class="save-btn">
            <i class="fas fa-copy"></i>复制存档
          </button>
          <button id="paste-save-btn" class="save-btn">
            <i class="fas fa-paste"></i>粘贴存档
          </button>
          <button id="clear-save-btn" class="save-btn">
            <i class="fas fa-remove"></i>清除存档
          </button>
        </div>
      </div>

      <div class="event-panel">
        <h2 class="event-title" id="event-title">最初的剧情</h2>
        <div class="event-description" id="event-description">
          村庄被暴动的侵染者毁灭了，你是唯一可能逃离的人！现在做出行动吧：
        </div>
        <div class="actions-container" id="actions-container">
          <button class="action-btn escape">从林地逃走</button>
          <button class="action-btn explore">冒险搜寻</button>
        </div>
      </div>

      <div class="combat-panel" id="combat-panel">
        <h2 class="combat-title">战斗</h2>
        <div class="combat-area">
          <div class="combatant">
            <div class="combatant-img">🧙‍♂️</div>
            <div class="combatant-name" id="player-name">勇者</div>
            <div class="hp-bar">
              <div class="hp-fill" id="player-hp-bar" style="width: 100%;"></div>
              <div class="hp-text" id="player-hp-text">50/50</div>
            </div>
          </div>

          <div class="combatant">
            <div class="combatant-img" id="enemy-icon">👹</div>
            <div class="combatant-name" id="enemy-name">哥布木</div>
            <div class="hp-bar">
              <div class="hp-fill" id="enemy-hp-bar" style="width: 100%;"></div>
              <div class="hp-text" id="enemy-hp-text">8/8</div>
            </div>
          </div>
        </div>

        <div class="combat-actions" id="combat-actions">
          <button class="action-btn fight" id="combat-attack">攻击</button>
          <button class="action-btn skill" id="combat-skill">技能</button>
          <button class="action-btn item" id="combat-item">道具</button>
        </div>

        <div class="combat-log" id="combat-log">
          <div class="log-entry info">战斗开始！</div>
        </div>
      </div>

      <div class="map-area">
        <h3 class="map-title">王国地图</h3>
        <div class="map-container" id="map-container">
          <!-- 地图位置会通过JS动态生成 -->
        </div>
      </div>
    </div>

    <div class="stats-panel">
      <h2 class="stats-title">角色状态</h2>
      <div class="location-indicator" id="location">当前位置: 陷落的村庄</div>

      <div class="character-stats">
        <div class="stat-item">
          <div class="stat-label">生命值</div>
          <div class="stat-value" id="hp-value">50</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">攻击力</div>
          <div class="stat-value" id="attack-value">5</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">防御力</div>
          <div class="stat-value" id="defend-value">3</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">金币</div>
          <div class="stat-value" id="gold-value">10</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">经验值</div>
          <div class="stat-value" id="exp-value">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">等级</div>
          <div class="stat-value" id="level-value">1</div>
        </div>
      </div>

      <div class="progress-container">
        <div class="stat-label">下一级经验</div>
        <div class="progress-bar">
          <div class="progress-fill" id="exp-progress" style="width: 0%;"></div>
          <div class="progress-text" id="exp-text">0/100</div>
        </div>
      </div>

      <h3 class="inventory-title">装备</h3>
      <div class="inventory-items" id="equipment-container">
        <!-- 装备会通过JS动态生成 -->
      </div>

      <h3 class="inventory-title">背包</h3>
      <div class="inventory-items" id="inventory-container">
        <!-- 背包物品会通过JS动态生成 -->
      </div>

      <h3 class="inventory-title">技能</h3>
      <div class="inventory-items" id="skills-container">
        <!-- 技能会通过JS动态生成 -->
      </div>
    </div>
  </div>

  <!-- 道具选择模态框 -->
  <div class="modal" id="item-modal">
    <div class="modal-content">
      <h2 class="modal-title">选择道具</h2>
      <div class="item-modal-grid" id="item-modal-grid">
        <!-- 道具项会动态生成 -->
      </div>
      <div class="modal-actions">
        <button class="action-btn" id="close-item-modal">关闭</button>
      </div>
    </div>
  </div>

  <!-- 技能选择模态框 -->
  <div class="modal" id="skill-modal">
    <div class="modal-content">
      <h2 class="modal-title">选择技能</h2>
      <div class="skill-modal-grid" id="skill-modal-grid">
        <!-- 技能项会动态生成 -->
      </div>
      <div class="modal-actions">
        <button class="action-btn" id="close-skill-modal">关闭</button>
      </div>
    </div>
  </div>

  <!-- 升级奖励模态框 -->
  <div class="modal" id="levelup-modal">
    <div class="modal-content">
      <h2 class="modal-title">等级提升！</h2>
      <div class="event-description" id="levelup-description">
        恭喜你升到了 <span id="new-level">2</span> 级！请选择一项奖励：
      </div>
      <div class="modal-actions">
        <button class="action-btn" id="levelup-hp">增加生命值</button>
        <button class="action-btn" id="levelup-attack">增加攻击力</button>
        <button class="action-btn" id="levelup-defend">增加防御力</button>
        <button class="action-btn" id="levelup-skill">获得新技能</button>
      </div>
    </div>
  </div>

  <!-- 存档操作模态框 -->
  <div class="modal" id="save-modal">
    <div class="modal-content">
      <h2 class="modal-title" id="save-modal-title">存档操作</h2>
      <div class="save-modal-content">
        <textarea class="save-textarea" id="save-textarea" placeholder="存档内容将显示在这里..."></textarea>
        <div class="modal-actions">
          <button class="action-btn" id="save-modal-confirm">确认</button>
          <button class="action-btn" id="save-modal-cancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 通知 -->
  <div class="notification" id="notification">
    <div id="notification-text">操作成功！</div>
  </div>
  <!-- 战斗界面 悬停在玩家/敌人上时显示 -->
  <div class="unit-info-notice" id="unit-info-notice">
    <div class="unit-name"></div>
    <div class="unit-attrs"></div>
    <div class="unit-status"></div>
    <div class="unit-equipment"></div>
    <div class="enemy-unit-reward"></div>
  </div>
  <!-- 仅当游戏结束时显示 -->
  <div class="modal stat-modal" id="stat-modal">
    <div class="modal-content">
      <div class="modal-title">
        <h2 id="stat-title">游戏胜利/失败</h2>
      </div>
      <div class="stat-modal-brief" id="stat-modal-brief">
        <div class="stat-survival-count" id="stat-survival-count">
          
        </div>
        <div class="stat-kill-count" id="stat-kill-count">
        </div>
        <div class="stat-damage" id="stat-damage">

        </div>
        <div class="stat-player-attrs" id="stat-player-attrs">
          
        </div>
      </div>
      <div class="modal-actions">
        <button class="action-btn" id="close-stat-modal">关闭</button>
      </div>
    </div>
  </div>
  <script>
    
    // 游戏数据
    const gameData = {
      gameTime:0,
      currentLocation: "陷落的村庄",
      currentPlaceIndex: 0,
      player: JSON.parse(JSON.stringify(rpgGameBasePlayerData)),
      currentEvent: JSON.parse(JSON.stringify(rpgGameVeryStartEvent)),
      combat: JSON.parse(JSON.stringify(rpgGameBaseCombatData)),
      locations: [
        { name: "陷落的村庄", description: "被摧毁的故乡", enemies: ["路边一条", "路边一筒", "路边一万", '路边一条龙'],

          explore: [
            {
              type:'skill',
              rate:20,
              name:'水弹Lv5',
              require:{
                level:5,
              },
            }
          ].filter(Boolean)
        },
        { name: "受侵蚀的山林", description: "危险的森林", enemies: ["哥布木", "哥布林", "哥布森"] },
        {
          name: "残破的教堂", description: "暂时的避难所", enemies: ["哥石木", "哥石林"], 
          explore: [
            {
              type: 'item',
              rate: 80,
              require: {
                level: 10,
                defeatList:['哥布森'],
              },
              name: '泣玉',
            },
            {
              type:'skill',
              rate:20,
              name:'水弹Lv10',
              require:{
                level:20,
              },
            }
          ].filter(Boolean)
        },
        { name: "山中湖", description: "宁静的湖泊", enemies: ["哥石森", "弟剪木"],
          explore:[
            ...Array.from({ length: 10 }).map((m, i) => {
              let lvNum = i + 1;
              return {
                type:'item',
                id: `cur-gold-attack-lv${lvNum}`,
                name: `财富攻击Lv${lvNum}`,
                rate: 20 / lvNum,
                quantity: 1,
                require:{
                  level: lvNum * 2,
                  defeatList: ['哥石森'],
                }
              }
            }),
          ].filter(Boolean)
        },
        { name: "国都", description: "王国的中心", enemies: ["弟剪林", "弟剪森", '弟剪吹'] ,
          explore:[
            ...Array.from({ length: 5 }).map((m, i) => {
              let lvNum = i + 1;
              return {
                type:'skill',
                name: `水枪Lv${lvNum}`,
                rate: 30 / lvNum,
                require:{
                  level: 30 + i * 2,
                }
              }
            }),
          ].filter(Boolean)
        },
        { name: "失修地道", description: "黑暗的地下通道", enemies: ["路边一条龙", "路边大四喜", 'undefined'],
          explore:[
            ...Array.from({ length: 3 }).map((m, i) => {
              let lvNum = i + 1;
              return {
                type:'skill',
                name: `水龙弹Lv${lvNum}`,
                rate: 50 / lvNum,
                require:{
                  level: 50 + i ** 2,
                }
              }
            }),
          ].filter(Boolean)
        }
      ],
      uselessExploreResults: [
        { name: '你发呆了一会儿！', rate: 20, },
        { name: '你看到一个巨大的背影，躲了一阵子！', rate: 20, },
        { name: '看到熟悉的风景，感怀了一阵子！', rate: 20, },
        { name: '找到一个安全的地方，好好地睡了一会儿！', rate: 20, effect: { hp: 100 } },
        { name: '找到一个简陋的地方，睡觉但被蚊虫叮了！', rate: 20, effect: { hp: -1 } },
        { name: '被什么东西追了一路，你终于安全了！', rate: 20, },
        { name: '追了猎物很久，但没捉到！', rate: 20, },
        { name: '路遇小河，你取了水！', rate: 20, },
        { name: '掉进井里，废了好长时间爬出来！', rate: 20, }
      ],
      lvupRewardSkills: [
        // "水弹",
        // "风弹",
        "火弹",
        "电弹",
        "强力击",
        "治疗术",
        // "钱袋猛击",
        '大治疗术',
        // '物品盲盒',
      ].filter(Boolean),

      allEnemies:JSON.parse(JSON.stringify(rpgGameEnemyData)),
      allItems:JSON.parse(JSON.stringify(rpgGameItemData)),
      allSkills:JSON.parse(JSON.stringify(rpgGameSkillData)),
      allStatus:JSON.parse(JSON.stringify(rpgGameStatusData)),
      allEquips:JSON.parse(JSON.stringify(rpgGameEquipmentData)),
    };

    // DOM 元素
    const elements = {
      eventTitle: document.getElementById('event-title'),
      eventDescription: document.getElementById('event-description'),
      actionsContainer: document.getElementById('actions-container'),
      combatPanel: document.getElementById('combat-panel'),
      playerName: document.getElementById('player-name'),
      playerHpBar: document.getElementById('player-hp-bar'),
      playerHpText: document.getElementById('player-hp-text'),
      enemyIcon: document.getElementById('enemy-icon'),
      enemyName: document.getElementById('enemy-name'),
      enemyHpBar: document.getElementById('enemy-hp-bar'),
      enemyHpText: document.getElementById('enemy-hp-text'),
      combatActions: document.getElementById('combat-actions'),
      combatLog: document.getElementById('combat-log'),
      location: document.getElementById('location'),
      hpValue: document.getElementById('hp-value'),
      attackValue: document.getElementById('attack-value'),
      defendValue: document.getElementById('defend-value'),
      goldValue: document.getElementById('gold-value'),
      expValue: document.getElementById('exp-value'),
      levelValue: document.getElementById('level-value'),
      expProgress: document.getElementById('exp-progress'),
      expText: document.getElementById('exp-text'),
      mapContainer: document.getElementById('map-container'),
      equipmentContainer: document.getElementById('equipment-container'),
      inventoryContainer: document.getElementById('inventory-container'),
      skillsContainer: document.getElementById('skills-container'),
      itemModal: document.getElementById('item-modal'),
      itemModalGrid: document.getElementById('item-modal-grid'),
      closeItemModal: document.getElementById('close-item-modal'),
      skillModal: document.getElementById('skill-modal'),
      skillModalGrid: document.getElementById('skill-modal-grid'),
      closeSkillModal: document.getElementById('close-skill-modal'),
      levelupModal: document.getElementById('levelup-modal'),
      newLevel: document.getElementById('new-level'),
      levelupDescription: document.getElementById('levelup-description'),
      levelupHp: document.getElementById('levelup-hp'),
      levelupAttack: document.getElementById('levelup-attack'),
      levelupDefend: document.getElementById('levelup-defend'),
      levelupSkill: document.getElementById('levelup-skill'),
      saveModal: document.getElementById('save-modal'),
      saveModalTitle: document.getElementById('save-modal-title'),
      saveTextarea: document.getElementById('save-textarea'),
      saveModalConfirm: document.getElementById('save-modal-confirm'),
      saveModalCancel: document.getElementById('save-modal-cancel'),
      notification: document.getElementById('notification'),
      notificationText: document.getElementById('notification-text'),
      unitInfoNotice: document.getElementById('unit-info-notice'),
      statModal: document.getElementById('stat-modal'),
      closeStatModal: document.getElementById('close-stat-modal'),
      statModalBrief: document.getElementById('stat-modal-brief'),
    };

    // 存档操作类型
    let currentSaveOperation = null;

    // 初始化游戏
    function initGame() {
      // 尝试加载本地存档
      loadLocalSave();

      initData()

      renderMap();
      updateUI();
      setupEventListeners();
    }

    function initData() {
      // 玩家
      // 物品调用
      let player = gameData.player
      // 物品
      for (let i = 0; i < player.inventory.length; i++) {
        player.inventory[i] = {
          ...(rpgGameItemData.find(m => m.name === player.inventory[i].name) || {}),
          quantity: player.inventory[i].quantity || 1,
        }
      }
      for(let i=0;i<player.skills.length;i++){
        player.skills[i] = player.skills[i].isUnico?player.skills[i]:{
          ...(rpgGameSkillData.find(m => m.name === player.skills[i].name) || {}),
        }
      }
      Object.keys(player.equipment).forEach(k=>{
        if(player.equipment[k]){
          player.equipment[k] = player.equipment[k].isUnico?player.equipment[k]:JSON.parse(JSON.stringify(rpgGameEquipmentData.find(m=>m.name===player.equipment[k].name)||null))
        }
      })
    }

    // 渲染地图
    function renderMap() {
      elements.mapContainer.innerHTML = '';
      gameData.locations.forEach(location => {
        const locationEl = document.createElement('div');
        locationEl.className = `map-location ${gameData.currentLocation === location.name ? 'active' : ''}`;
        locationEl.textContent = location.name;
        // 地图点击跳转
        locationEl.addEventListener('click', () => {
          gameData.gameTime++
          if (gameData.currentLocation !== location.name) {
            moveToLocation(location.name);
          }
        });
        elements.mapContainer.appendChild(locationEl);
      });
    }

    // 移动到新地点
    function moveToLocation(locationName) {
      gameData.currentLocation = locationName;
      gameData.currentPlaceIndex = gameData.locations.findIndex(location => location.name === locationName);
      elements.location.textContent = `当前位置: ${locationName}`;

      // 随机遭遇敌人（30%几率）
      if (Math.random() < 0.3) {
        startCombat();
      } else {
        gameData.currentEvent = {
          title: "抵达新地点",
          description: `你成功抵达了${locationName}，暂时没有发现敌人。`,
          actions: [
            { text: "探索区域", type: "explore" },
            { text: "休息恢复", type: "rest" },
            gameData.currentPlaceIndex > 0 ? { text: '返回', type: 'goForward' } : null,
            gameData.player.inventory.length > 0 ? { text: '使用物品', type: 'useItem' } : null
          ].filter(Boolean)
        };
      }

      renderMap();
      updateUI();
    }

    // 更新UI
    function updateUI() {
      // 更新事件面板
      elements.eventTitle.textContent = gameData.currentEvent.title;
      elements.eventDescription.textContent = gameData.currentEvent.description;

      // 清除现有按钮
      elements.actionsContainer.innerHTML = '';

      // 添加新按钮
      gameData.currentEvent.actions.forEach(action => {
        const button = document.createElement('button');
        button.className = `action-btn ${action.type}`;
        button.textContent = action.text;
        // 行动点击
        button.addEventListener('click', () => handleAction(action));
        elements.actionsContainer.appendChild(button);
      });

      // 更新状态面板
      elements.hpValue.textContent = gameData.player.hp;
      elements.attackValue.textContent = gameData.player.attack;
      elements.defendValue.textContent = gameData.player.defend;
      elements.goldValue.textContent = gameData.player.gold>1e8?gameData.player.gold.toExponential(4):gameData.player.gold;
      elements.expValue.textContent = gameData.player.exp;
      elements.levelValue.textContent = gameData.player.level;

      // 更新经验条
      const expPercent = (gameData.player.exp / gameData.player.nextLevelExp) * 100;
      elements.expProgress.style.width = `${expPercent}%`;
      elements.expText.textContent = `${gameData.player.exp}/${gameData.player.nextLevelExp}`;

      // 更新装备
      elements.equipmentContainer.innerHTML = '';
      Object.values(gameData.player.equipment).forEach(item => {
        if (item) {
          let value = item.attack ? item.attack : item.defend ? item.defend : item.criticalRate ? `${item.criticalRate}% ${item.criticalDamage}%` : '';
          const itemEl = document.createElement('div');
          itemEl.title = item.description;
          itemEl.className = 'item-card';
          itemEl.innerHTML = `
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-quantity equip">${value}</div>
                    `;
          elements.equipmentContainer.appendChild(itemEl);
        }
      });

      // 更新背包
      elements.inventoryContainer.innerHTML = '';
      gameData.player.inventory.forEach(item => {
        if (item.quantity > 0) {
          const itemEl = document.createElement('div');
          itemEl.title = item.description;
          itemEl.className = 'item-card';
          itemEl.innerHTML = `
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-quantity">${item.quantity}</div>
                    `;
          // 背包物品点击事件
          itemEl.addEventListener('click', () => useItem(item, !gameData.combat.active));
          elements.inventoryContainer.appendChild(itemEl);
        }
      });

      // 更新技能
      elements.skillsContainer.innerHTML = '';
      gameData.player.skills.forEach(playerSkill => {
        let skill = playerSkill.isUnico
          ? playerSkill
          : rpgGameSkillData.find(m => m.name === playerSkill.name);
        const skillEl = document.createElement('div');
        let skillAttr = displaySkillAttrs(skill)
        skillEl.title = skillAttr.description
        skillEl.className = 'item-card';
        skillEl.innerHTML = `
                    <div class="item-icon">${skill.icon}</div>
                    <div class="item-name">${skill.name}</div>

    // 查看所需是否满足
    function checkRequire(require = {}) {
      let result = {
        done: true,
      }
      if (require.level) {
        if (gameData.player.level < require.level) {
          result.level = false;
          result.done = false
          return result
        }
      }
      if(require.damage){
        if(!gameData.player.currentGameStat){
          result.hasAnyFightYet = false;
          result.done = false
          return result
        }
        if(require.damage.max){
          if(gameData.player.currentGameStat.maxDamage < require.damage.max){
            result.hasDamageOver = false;
            result.done = false;
            return result
          }
        }
      }
      if(require.location){
        if(gameData.currentLocation !== require.location){
          result.stayThatPlace = false;
          result.done = false;
          return result;
        }
      }
      if (require.defeatList) {
        if(!gameData.player.currentGameStat){
          result.hasAnyFightYet = false;
          result.done = false
          return result
        }
        result.defeatResult = {}
        if(!gameData.player.currentGameStat.history){
          gameData.player.currentGameStat.history = []
          result.noHistroy = false;
          result.done = false;
          return result
        }
        gameData.player.currentGameStat.history.filter(his => {
          return his.isVictory
        }).forEach(m => {
          let enemyName = m.enemy.name;
          let matchIndex = require.defeatList.findIndex(dft => {
            let name = typeof dft ==='object'?dft.name:dft;
            return name  === enemyName
          })
          if (matchIndex !== -1) {
            result.defeatResult[enemyName] = true;
            return true
          }
        })
        result.hasDefeatAll = require.defeatList.every(dft => {
          let name = typeof dft ==='object'?dft.name:dft;
          return result.defeatResult[name]
        })
        if (!result.hasDefeatAll) {
          result.done = false
          return result
        }
      }
      if (require.item) {
        let tool = gameData.player.inventory.filter(m => {
          return require.item.includes(m.name)
        })
        result.hasGottenAll = tool.length === require.item.length
        if (!result.hasGottenAll) {
          result.done = false
          return result
        }
      }
      return result
    }

            moveToLocation(gameData.locations[currentIndex - 1].name);

          const currentIndex = gameData.locations.findIndex(l => l.name === gameData.currentLocation);

    function startPlayerRound(){

        type:'player',
        text:'你的回合开始！',
      })
      let thePlayer = gameData.player
      if(thePlayer.onRoundStart){ // 这个配置优先于状态执行
        if(!runUnitHook(thePlayer.onRoundStart,thePlayer).next){
          return
        }
      }
      // 状态   
      if(thePlayer.status && thePlayer.status.length){
        let stageStatusList = thePlayer.status.filter(m=>{
          return m.autoOn === 'roundStart'
        })
        if(stageStatusList.length){
          let isStatusNext 
          for(let i=0;i<thePlayer.status.length;i++){
            let status = thePlayer.status[i]
            let nextCheck = statusActions(status,thePlayer,true)
            if(!nextCheck.next){
              return
            }
          }
        }
      }
      return null;
    }

      let result = {next:true}

        if(stageStatusList.length){
          let isStatusNext 
          for(let i=0;i<thePlayer.status.length;i++){

            let nextCheck = statusActions(status,thePlayer,true)
            if(!nextCheck.next){

      gameData.combat.log.push(endRoundLog)

      if(theEnemy.status && theEnemy.status.length){
        let stageStatusList = theEnemy.status.filter(m=>{
          return m.autoOn === 'roundEnd'
        })
        if(stageStatusList.length){
          let isStatusNext 
          for(let i=0;i<theEnemy.status.length;i++){
            let status = theEnemy.status[i]
            let nextCheck = statusActions(status,theEnemy,false)
            if(!nextCheck.next){
              result.next=false
              theCombat.log.push(endRoundLog)
              return result
            }
          }
        }
      }
      theCombat.log.push(endRoundLog)
      return result;
    }

      // 持有物品 泣玉

    // 开始战斗
    function startCombat() {
      // 获取当前地点的敌人类型
      const currentLocation = gameData.locations.find(l => l.name === gameData.currentLocation);
      const locationEnemies = currentLocation.enemies;

      // 从当前地点的敌人中随机选择一个
      const enemyName = locationEnemies[Math.floor(Math.random() * locationEnemies.length)];
      const enemyData = rpgGameEnemyData.find(e => e.name === enemyName);

      gameData.combat.enemy = { ...JSON.parse(JSON.stringify(enemyData)) };
      gameData.combat.active = true;
      gameData.combat.log = [{ type: "info", text: `遭遇了${gameData.combat.enemy.name}！战斗开始！` }];
      gameData.combat.isPlayerRound = !gameData.combat.enemy.startFirst
      gameData.combat.currentTurn = gameData.combat.isPlayerRound?'player':'enemy';
      gameData.combat.totalRound = 0
      gameData.combat.playerRoundNum = 0
      gameData.combat.enemyRoundNum = 0
      // 更新战斗事件
      gameData.currentEvent = {
        title: "遭遇敌人",
        description: `你遭遇了${gameData.combat.enemy.name}！准备战斗！`,
        actions: []
      };
      if(gameData.combat.enemy.startFirst){
        if(gameData.combat.enemy.onFightStart){
          if(!runUnitHook(gameData.combat.enemy.onFightStart,gameData.combat.enemy,false).next){
            return
          }
        }
        if(gameData.player.onFightStart){
          if(!runUnitHook(gameData.player.onFightStart,gameData.player,true).next){
            return
          }
        }
        runEnemyRoundAction()
      }else{
        if(gameData.player.onFightStart){
          if(!runUnitHook(gameData.player.onFightStart,gameData.player,true).next){
            return
          }
        }
        if(gameData.combat.enemy.onFightStart){
          if(!runUnitHook(gameData.combat.enemy.onFightStart,gameData.combat.enemy,false).next){
            return
          }
        }
        gameData.combat.totalRound++
        gameData.combat.playerRoundNum++
      }

      updateUI();
    }

    // 处理玩家攻击
    function handlePlayerAttack() {
      if (!gameData.combat.active || !gameData.combat.enemy) return;

      // 计算伤害（考虑攻击力和防御力）
      let baseDamage = pickUnitAttack(gameData.player);
      let criticResult = criticValue(baseDamage, gameData.player)
      let isCritic = criticResult.isCritic
      baseDamage = criticResult.value;

      let playerDamage = baseDamage;
      if(gameData.player.attackDamageType!=='absolute'){
        playerDamage = hurtUnit(playerDamage, gameData.combat.enemy)
      }
      let enemyHpBefore = gameData.combat.enemy.hp;
      gameData.combat.enemy.hp -= playerDamage;
      // 统计伤害
      sumPlayer({
        sumType: 'damage',
        damageType: gameData.player.attackDamageType||'normal',
        isPlayerRound: true,
        value: playerDamage,
        isCritic,
      })

      // 添加战斗日志
      gameData.combat.log.push({
        type: "player",
        text: `${isCritic ? '暴击了！' : ''}你对${gameData.combat.enemy.name}造成了${playerDamage}点伤害！`
      });



      // 检查敌人是否被击败
      let dieCheck = handleUnitDie({
        method:'attack',
        methodName:'attack',
        attack:gameData.player.attack,
        before:enemyHpBefore,
        value:enemyHpBefore,
      },gameData.combat.enemy,false)

      if (!dieCheck.next) {
        return
      }
      let endResult = endPlayerRound()
      if(!endResult.next){
        return
      }
      // 敌人反击
      setTimeout(() => {
        runEnemyRoundAction()
      }, 1000);

      updateCombatUI();
    }

    function handleGameStat(){
      let theGameStat = gameData.player.currentGameStat||{};

      let totalDefeat = theGameStat.gameDefeatCount
      let enemyMostDefeat = {}

      let totalDamage = theGameStat.damageSum||0

        enemyMostDefeat,

    // 使用道具
    function useItem(item, isOutFight = false,isBySkill=false) {
      if (item.effectType === 'heal') {

        let hpBefore = gameData.player.hp;
        let healAmount;
        if (item.effect.hp) {
          // 治疗道具
          healAmount = item.effect.hp;

        } else if (item.effect.bigHp) {
          // 大回复药
          healAmount = Math.ceil(item.effect.bigHp / 100 * gameData.player.maxHp);

        } else {
          healAmount = 10
        }

        let criticResult = criticValue(healAmount, gameData.player)
        let isCritic = criticResult.isCritic
        healAmount = criticResult.value;

          // 消耗恢复道具
          item.quantity--;

        // 恢复生命值

          sumType: 'heal',
          method: item.name || 'item',
          item,
          healType: 'normal',

            })

              } else if (item.id === 'skill-box') {
                receiver[matchIndex] = one
              }
            } else {
              receiver.push(one)
            }
          })
          //  to do  统计开箱结果
          // to do 如果获得了什么 统计物品获得与持有最大数量
          let announce = `你使用了${item.name}，${ones.length ? `获得了${ones.map(m => m.name).join('，')}！` : '什么也没得到！'}`

              ].filter(Boolean)
            };
          }
        }
      }

    function displaySkillAttrs(skill) {
      let skillAttrs = []
      let skillType = skill.skillType
      let skillValue = ''
      switch (skillType) {
        case 'damage': {
          let damageTypePart = rpgGameDamageTypeMapper[skill.damageType || 'normal']
          let damagePart = ''
          if (skill.damage) {

            damagePart = `造成${skill.damage}的${damageTypePart}。`
            skillValue = `${skill.damage} ${damageTypePart[0]}`

          } else if (skill.bigAttackDamage) {

            damagePart = `造成${skill.bigAttackDamage}%攻击力的${damageTypePart}。`
            skillValue = `${skill.bigAttackDamage}%Atk ${damageTypePart[0]}`

          } else if (skill.bigEnemyMaxHpDamage) {

            damagePart = `造成${skill.bigEnemyMaxHpDamage}%敌方最大生命值的${damageTypePart}。`
            skillValue = `${skill.bigEnemyMaxHpDamage}%敌MHP ${damageTypePart[0]}`

          } else if (skill.bigGoldDamage) {

            damagePart = `造成${skill.bigGoldDamage}%拥有金币数量的${damageTypePart}。`
            skillValue = `${skill.bigGoldDamage}%金 ${damageTypePart[0]}`

          } else if (skill.randomDamage) {

            damagePart = `随机造成 1 ~ ${skill.randomDamage} 的${damageTypePart}。`
            skillValue = `${skill.randomDamage} ${damageTypePart[0]}`

          }
          skillAttrs.push(damagePart)
          break;
        }
        case 'heal': {
          let healPart = ``
          if (skill.heal) {
            healPart = `回复${skill.heal}点生命值。`
            skillValue = `${skill.heal}`
          } else if (skill.bigHeal) {
            healPart = `回复${skill.bigHeal}%最大生命值的生命值。`
            skillValue = `${skill.bigHeal}%Mx`
          }
          skillAttrs.push(healPart)
          break;
        }
        case 'status': {
          let statusPart = `给敌人施加${skill.status.value || 1}点"${skill.status.name}"状态`
          skillValue = `${skill.status.value}`
          skillAttrs.push(statusPart)
          break;
        }
        case 'rule': {
          let rulePart = skill.description
          skillAttrs.push(rulePart)
          break;
        }
      }
      return {
        description: skillAttrs.join(''),
        value: skillValue,
      }
    }

    function sumPlayerCurrentGame() {
      const stat_level = 'game'
      let options = arguments[0]
      // sum game
      if (!gameData.player.currentGameStat) {
        gameData.player.currentGameStat = {}
      }
      const statObj = gameData.player.currentGameStat
      if(options.sumType==='end-game'){
        return handleCommonUnitSum(options,gameData.player,'game')
      }
      let shouldStatFight = options.isOutFight !== true && !['end-combat', 'end-game'].includes(options.sumType)
      if (shouldStatFight) {
        sumPlayerCurrentFight(options);
      }
      if (options.sumType !== 'end-round') {// 保证end-xxx  不重复统计
        handleCommonUnitSum(options, statObj, stat_level)
      }

    }
    function sumPlayerCurrentFight() {
      const stat_level = 'combat'
      let options = arguments[0]
      if (!gameData.player.currentGameStat.currentFightStat) {
        gameData.player.currentGameStat.currentFightStat = {}
      }
      const statObj = gameData.player.currentGameStat.currentFightStat
      let shouldStatRound = options.isPlayerRound !== false && !['end-round', 'end-combat', 'end-game'].includes(options.sumType)
      if (shouldStatRound) {
        sumPlayerCurrentRound(options);
      }
      handleCommonUnitSum(options, statObj)
    }
    function sumPlayerCurrentRound(options = {}) {
      const stat_level = 'round'
      // sum current round
      if (!gameData.player.currentGameStat.currentFightStat.currentRoundStat) {
        gameData.player.currentGameStat.currentFightStat.currentRoundStat = {}
      }
      const statObj = gameData.player.currentGameStat.currentFightStat.currentRoundStat
      handleCommonUnitSum(options, statObj, stat_level)
    }
    function handleCommonUnitSum(options, unit, stat_level) {
      switch (options.sumType) {
        // 统计造成的伤害 总伤害 最大单次伤害 各类伤害各种总伤害、最大单次伤害
        case 'damage': {
          unit.damageSum = (unit.damageSum || 0) + options.value;
          // damge 统计 max sum; typeMax typeSum
          if (options.value > (unit.maxDamage||0)) {
            unit.maxDamage = options.value
            unit.maxDamageType = options.damageType;
            unit.maxDamageTarget = JSON.parse(JSON.stringify(options.target || { name: 'enemy' }))
            unit.isMaxDamageCritic = options.isCritic || false;
          }
          // 暴击伤害统计
          if (options.isCritic) {
            unit.criticDamageCount = (unit.criticDamageCount || 0) + 1;
            unit.criticDamageSum = (unit.criticDamageSum || 0) + options.value;
            unit.criticMaxDamage = Math.max(unit.criticMaxDamage || 0, options.value);
            if (!unit.criticDamageList) {
              unit.criticDamageList = []
            }
            unit.criticDamageList.push({
              value: options.value,
              type: options.damageType,
              target: JSON.parse(JSON.stringify(options.target || 'enemy')),
            })
          }

          // 次级统计 类型伤害
          if (!unit.typeDamageStat) {
            unit.typeDamageStat = []
          }
          let typeOneIndex = unit.typeDamageStat.findIndex(m => m.type === options.damageType)
          if (typeOneIndex > -1) {
            if (options.value > unit.typeDamageStat[typeOneIndex].max) {
              unit.typeDamageStat[typeOneIndex].max = options.value
              unit.typeDamageStat[typeOneIndex].isMaxCritc = options.isCritic || false;
            }
            unit.typeDamageStat[typeOneIndex].sum += options.value
            unit.typeDamageStat[typeOneIndex].count++;
          } else {
            unit.typeDamageStat.push({
              type: options.damageType,
              max: options.value,
              sum: options.value,
              count: 1,
            })
          }
          if(unit.typeDamageStat.length>1){
            // 累积 > 最值 > 次数
            unit.typeDamageStat.sort((a,b)=>{
              return b.count - a.count
            }).sort((a,b)=>{
              return b.max - a.max
            }).sort((a,b)=>{
              return b.sum - a.sum
            })
          }
          break
        };
        // 统计受到的伤害 总承伤 最大单次承伤 各类伤害总承伤、最大单次承伤
        case 'hurt': {
          unit.hurtSum = (unit.hurtSum || 0) + options.value;

          if (options.value > (unit.maxHurt||0)) {
            unit.maxHurt = options.value
            unit.maxHurtType = options.hurtType;
            unit.maxHurtSource = JSON.parse(JSON.stringify(options.source || { name: 'enemy' }))
          }

          // 被暴击统计
          if (options.isCritic) {
            unit.criticHurtCount = (unit.criticHurtCount || 0) + 1;
            unit.criticHurtSum = (unit.criticHurtSum || 0) + options.value;
            unit.criticMaxHurt = Math.max(unit.criticMaxHurt || 0, options.value);
            if (!unit.criticHurtList) {
              unit.criticHurtList = []
            }
            unit.criticHurtList.push({
              value: options.value,
              type: options.hurtType,
              source: JSON.parse(JSON.stringify(options.source || 'enemy'))
            })
          }

          // 次级统计 类型伤害
          if (!unit.typeHurtStat) {
            unit.typeHurtStat = []
          }
          let typeOneIndex = unit.typeHurtStat.findIndex(m => m.type === options.hurtType)
          if (typeOneIndex > -1) {
            unit.typeHurtStat[typeOneIndex].max = Math.max(unit.typeHurtStat[typeOneIndex].max, options.value)
            unit.typeHurtStat[typeOneIndex].sum += options.value
            unit.typeHurtStat[typeOneIndex].count++;
          } else {
            unit.typeHurtStat.push({
              type: options.hurtType,
              max: options.value,
              sum: options.value,
              count: 1
            })
          }
          if(unit.typeHurtStat.length>1){
            // 累积 > 最值 > 次数
            unit.typeHurtStat.sort((a,b)=>{
              return b.count - a.count
            }).sort((a,b)=>{
              return b.max - a.max
            }).sort((a,b)=>{
              return b.sum - a.sum
            })
          }
          break
        };
        // 统计治疗量
        case 'heal': {
          unit.healSum = (unit.healSum || 0) + options.value;

          if (options.value > (unit.maxHeal||0)) {
            unit.maxHeal = options.value
            unit.maxHealType = options.healType;
            unit.maxHealTarget = JSON.parse(JSON.stringify(options.target || { name: 'enemy' }))
          }
          break
        };
        case 'prop': {
          // 仅游戏级统计记录本项目
          if (stat_level !== 'game') { break }
          if (!unit.propStatList) {
            unit.propStatList = []
          }
          let index = unit.propStatList.findIndex(m => {
            return m.prop = options.prop;
          })
          if (index !== -1) {
            unit.propStatList[index].count += 1
            unit.propStatList[index].sum += options.value
            unit.propStatList[index].max = Math.max(unit.propStatList[index].max, options.value);
          } else {
            unit.propStatList.push({
              prop: options.prop,
              count: 1,
              sum: options.value,
              max: options.value
            })
          }
          if(unit.propStatList.length>1){
            // 累积 > 最值 > 次数
            unit.propStatList.sort((a,b)=>{
              return b.count - a.count
            }).sort((a,b)=>{
              return b.max - a.max
            }).sort((a,b)=>{
              return b.sum - a.sum
            })
          }
          break;
        }
        // 生命消耗
        case 'hp': {
          if (options.changeType === 'increase') {
            unit.hpGainSum = (unit.hpGainSum || 0) + options.value;
            unit.hpGainMax = Math.max(unit.hpGainMax || 0, options.value);
          } else if (options.changeType === 'decrease') {
            unit.hpCostCount = (unit.expCost || 0) + 1
            unit.hpCostSum = (unit.hpCostSum || 0) + options.value;
            unit.hpCostMax = Math.max(unit.hpCostMax || 0, options.value);
          }
          break;
        }
        // 魔法值变动
        case 'mp': {
          if (options.changeType === 'increase') {
            unit.mpGainSum = (unit.mpGainSum || 0) + options.value;
            unit.mpGainMax = Math.max(unit.mpGainMax || 0, options.value);
          } else if (options.changeType === 'decrease') {
            unit.mpCostCount = (unit.expCost || 0) + 1
            unit.mpCostSum = (unit.mpCostSum || 0) + options.value;
            unit.mpCostMax = Math.max(unit.mpCostMax || 0, options.value);
          }
          break;
        }
        case 'gold': {
          // 仅游戏级统计记录本项目
          if (stat_level !== 'game') { break }
          if (options.changeType === 'increase') {
            unit.goldGainSum = (unit.goldGainSum || 0) + options.value;
            unit.goldGainMax = Math.max(unit.goldGainMax || 0, options.value);
          } else if (options.changeType === 'decrease') {
            unit.goldCostCount = (unit.expCost || 0) + 1
            unit.goldCostSum = (unit.goldCostSum || 0) + options.value;
            unit.goldCostMax = Math.max(unit.goldCostMax || 0, options.value);
          }
          break;
        }
        case 'exp': {
          // 仅游戏级统计记录本项目
          if (stat_level !== 'game') { break }
          if (options.changeType === 'increase') {
            unit.expGainSum = (unit.expGainSum || 0) + options.value;
            unit.expGainMax = Math.max(unit.expGainMax || 0, options.value);
          } else if (options.changeType === 'decrease') {
            unit.expCostCount = (unit.expCost || 0) + 1
            unit.expCostSum = (unit.expCostSum || 0) + options.value;
            unit.expCostMax = Math.max(unit.expCostMax || 0, options.value);
          }
          break;
        }
        case 'item': {
          // 仅游戏级统计记录本项目
          if (stat_level !== 'game') { break }
          if (!unit.itemStatList) {
            unit.itemStatList = []
          }
          unit.gameItemGainCount = (unit.gameItemGainCount || 0) + 1;
          let index = unit.itemStatList.findIndex(m => m.name === options.name);
          let quickStore = JSON.parse(JSON.stringify(options.item || null))
          if (index !== -1) {
            let one = unit.itemStatList[index];
            one.detailList.push(quickStore)
            one.count++;
          } else {
            unit.itemStatList.push({
              name: options.name,
              detailList: [quickStore],
              count: 1,
            })
          }
          if(unit.itemStatList.length>1){
            unit.itemStatList.sort((a,b)=>{
              return b.count-a.count
            })
          }
          break;
        }
        case 'skill': {
          // 仅游戏级统计记录本项目
          if (stat_level !== 'game') { break }
          if (!unit.skillStatList) {
            unit.skillStatList = []
          }
          unit.gameSkillGainCount = (unit.gameSkillGainCount || 0) + 1;
          let index = unit.skillStatList.findIndex(m => m.name === options.name);
          let quickStore = JSON.parse(JSON.stringify(options.skill || null))
          if (index !== -1) {
            let one = unit.skillStatList[index];
            one.detailList.push(quickStore)
            one.count++;
          } else {
            unit.skillStatList.push({
              name: options.name,
              detailList: [quickStore],
              count: 1,
            })
          }
          if(unit.skillStatList.length>1){
            unit.skillStatList.sort((a,b)=>{
              return b.count-a.count
            })
          }
          break;
        }
        case 'equipment': {
          // 仅游戏级统计记录本项目
          if (stat_level !== 'game') { break }
          if (!unit.equipmentStatList) {
            unit.equipmentStatList = []
          }
          let index = unit.equipmentStatList.findIndex(m => m.name === options.name);
          let quickStore = JSON.parse(JSON.stringify(options.equipment || null))
          if (index !== -1) {
            let one = unit.equipmentStatList[index];
            one.detailList.push(quickStore)
            one.count++;
          } else {
            unit.equipmentStatList.push({
              name: options.name,
              detailList: [quickStore],
              count: 1,
            })
          }
          if(unit.equipmentStatList.length>1){
            unit.equipmentStatList.sort((a, b) => b.count - a.count)
          }
          break;
        }
        case 'dead':{
          if (stat_level !== 'game') { break }
          // 统计死亡
          if (!unit.deathList) {
            unit.deathList = []
          }
          unit.gameDeathCount = (unit.gameDeathCount || 0) + 1;
          let index = unit.deathList.findIndex(dth => {
            return dth.sourceName === options.source.name
          })
          if (index !== -1) {
            unit.deathList[index].count++
            let mcIndex = unit.deathList[index].methodCounts.findIndex(m => m.method === options.method)
            if (mcIndex !== -1) {
              unit.deathList[index].methodCounts[mcIndex].count++
            } else {
              unit.deathList[index].methodCounts.push({ method: options.method, count: 1 })
            }
          } else {
            unit.deathList.push({
              sourceName: options.source.name,
              count: 1,
              methodCounts: [{ method: options.method, count: 1 }]
            })
          }
          if(unit.deathList.length>=2){
            unit.deathList.sort((a,b)=>{
              return b.count - a.count
            })
          }
          break;
        }
        // 统计击杀
        case 'defeat': {
          // 仅游戏级别统计击杀
          if (stat_level !== 'game') { break }
          if (!unit.defeatList) {
            unit.defeatList = []
          }
          // 整局游戏总击杀数
          unit.gameDefeatCount = (unit.gameDefeatCount || 0) + 1
          let index = unit.defeatList.findIndex(dft => {
            return dft.name === options.target.name
          })
          if (index !== -1) {
            unit.defeatList[index].count++
            let mcIndex = unit.defeatList[index].methodCounts.findIndex(m => m.method === options.method)
            if (mcIndex !== -1) {
              unit.defeatList[index].methodCounts[mcIndex].count++
            } else {
              unit.defeatList[index].methodCounts.push({ method: options.method, count: 1 })
            }
          } else {
            unit.defeatList.push({
              name: options.target.name,
              count: 1,
              methodCounts: [{ method: options.method, count: 1 }]
            })
          }
          if(unit.defeatList.length>=2){
            unit.defeatList.sort((a,b)=>{
              return b.count - a.count
            })
          }
          break
        };
        // 结束游戏的统计模块操作
        case 'end-game': { // 结束游戏 unit 为 全局对象
          if (unit.currentFightStat) {
            sumPlayer({ ...options, sumType: 'end-combat' })
          }
          if (!unit.history) {
            unit.history = []
          }
          unit.history.push(unit.currentGameStat)
          unit.currentGameStat = null;
          break;
        }
        case 'end-combat': { // 结束战斗 unit 为game级对象
          if (stat_level !== 'game') { break }
          // 回合未结束首先结束回合
          if (unit.currentRoundStat) {
            sumPlayer({ ...options, sumType: 'end-round' })
          }
          if (!unit.history) {
            unit.history = []
          }
          let currentFightStat = unit.currentFightStat
          currentFightStat.enemy = gameData.combat.enemy
          currentFightStat.isVictory = gameData.combat.enemy.hp <= 0
          unit.currentFightStat = null;
          unit.history.push(currentFightStat)
          break;
        }
        case 'end-round': { // 结束回合 unit为 combat 级对象
          if (stat_level !== 'combat') { break }
          if (!unit.history) {
            unit.history = []
          }
          let currentRoundStat = unit.currentRoundStat
          unit.currentRoundStat = null;
          unit.history.push(currentRoundStat)
          break;
        }
        // case 'end-action': {
        //   break;
        // }
        case 'status':{
          if(!unit.statusStatList){
            unit.statusStatList = [];
          }
          const optionsStatus = JSON.parse(JSON.stringify(options.status))
          let index = unit.statusStatList.findIndex(item => item.name === optionsStatus.name)
          let cur = optionsStatus.before+optionsStatus.delta;
          if( index !== -1 ){
            let one = unit.statusStatList[index]
            one.sum += optionsStatus.delta;
            if(one.max < cur){
              one.max = cur;
            }
          }else{
            unit.statusStatList.push({
              name: optionsStatus.name,
              sum: optionsStatus.delta,
              max: cur,
            })
          }
          // 优先排序总计 次级排序最值
          if(unit.statusStatList.length>=2){
            unit.statusStatList.sort((a,b)=>{
              return b.max - a.max;
            }).sort((a,b)=>{
              return b.sum - a.sum;
            })
          }
          break;
        }
      }
    }
    // 统计玩家方有关数据记录 
    function sumPlayer() {
      let options = arguments[0] || []
      if (options instanceof Array) {
        options.forEach(opt => {
          sumPlayer(opt)
        })
      } else {
        sumPlayerCurrentGame(options);
      }
    }
    // 执行阶段配置钩子对象 
    function runUnitHook(hookConfig={},unit={},isPlayer=true){
      let result = {next:true,}
      // 生命值恢复
      if(hookConfig.hpRecover){
        /**
         * ```txt
         * 生命值恢复系列
         * 核心 hpRecover:number;
         * 其他 
         * hpRecoverCount:number
         * hpRecoverType:'bigHp' | 'bigMaxHp' | 'hp' // 默认为 hp 
         * ```
        */
        let hpRecoverCount  = hookConfig.hpRecoverCount || 1
        for(let i=0;i<hpRecoverCount;i++){
          let before = unit.hp
          let value = hookConfig.hpRecover
          if(hookConfig.hpRecoverType === 'bigHp'){
            value = hookConfig.hpRecover / 100 * unit.Hp
          }else if(hookConfig.hpRecoverType === 'bigMaxHp'){
            value = hookConfig.hpRecover / 100 * unit.maxHp
          }
          unit.hp = Math.min(unit.hp + value,unit.maxHp)
          if(isPlayer){
            // 统计生命值恢复
            sumPlayer({
              sumType:'hp',
              changeType:'increase',
              method:'hook',
              hook:hookConfig,
              before,
              value:unit.hp - value
            })
          }
          // 战斗日志
          gameData.combat.log.push({
            type:isPlayer?'player':'enemy',
            text:`${isPlayer?"你":unit.name}恢复了${value}点生命值！`
          })
          updateCombatUI()
        }
      }
      // 魔法值恢复
      if(hookConfig.mpRecover){
        /**
         * ```txt
         * 魔法值恢复系列
         * 核心 mpRecover:number;
         * 其他 
         * mpRecoverCount:number
         * mpRecoverType:'bigMp'| 'mp' // 默认为 mp 
         * ```
        */
        let mpRecoverCount  = hookConfig.mpRecoverCount || 1
        for(let i=0;i<mpRecoverCount;i++){
          let before = unit.mp
          let value = hookConfig.mpRecover
          if(hookConfig.mpRecoverType === 'bigMp'){
            value = hookConfig.mpRecover / 100 * unit.Hp
          }
          unit.mp += value;
          if(isPlayer){
            // 统计生命值恢复
            sumPlayer({
              sumType:'mp',
              changeType:'increase',
              method:'hook',
              hook:hookConfig,
              before,
              value:unit.mp - value
            })
          }
          // 战斗日志
          gameData.combat.log.push({
            type:isPlayer?'player':'enemy',
            text:`${isPlayer?"你":unit.name}恢复了${value}点魔法值！`
          })
          updateCombatUI()
        }
      }
      // 造成伤害
      if(hookConfig.extraAttack){
        /**
         * ```txt
         * 造成伤害系列
         * 核心 extraAttack:number;
         * 其他 
         * extraAttackCount:number
         * extraAttackType:'bigAttack'| 'attack'
         * extraAttackDamageType: 伤害类型
         * isExtraAttackCriticalable: 是否可以暴击
         * isExtraAttackCritic 是否暴击
         * ```
        */
        //  攻击目标
        let targetUnit = isPlayer?gameData.combat.enemy:gameData.player;
        let extraAttack = hookConfig.extraAttack;
        let extraAttackCount = hookConfig.extraAttackCount || 1
        let extraAttackDamageType = hookConfig.extraAttackDamageType || 'normal';
        let extraAttackType = hookConfig.extraAttackType || 'attack';
        let unitAttack = pickUnitAttack(unit)
        for(let i=0;i<extraAttackCount;i++){
          let et = extraAttack;
          if(extraAttackType==='bigAttack'){
            et = extraAttack / 100 * unitAttack;
          }
          if(extraAttackDamageType !== 'absolute'){ // 非绝对伤害 则考虑敌方配置
            et = hurtUnit(et,targetUnit)
          }
          
          let targetHpBefore = targetUnit.hp;
          targetUnit.hp  -= et;
          
          // 战斗日志
          gameData.combat.log.push({
            type:isPlayer?'player':'enemy',
            text:`${isPlayer?"你":unit.name}对${targetUnit.name}造成${value}点伤害！`
          })
          updateCombatUI()
          
          if(isPlayer){
            // 统计造成的伤害
            sumPlayer({
              sumType:'damage',
              damageType:extraAttackDamageType, // 伤害类型
              value: et, // 统计基准值
              isPlayerRound: true, // 是否是玩家回合
              target: theEnemy, // 伤害目标
            })
          }else {
            // 统计承伤
            // 统计造成的伤害
            sumPlayer({
              sumType:'hurt',
              hurtType:extraAttackDamageType, // 伤害类型
              value: et, // 统计基准值
              isPlayerRound: false, // 是否是玩家回合
              source: theEnemy, // 伤害目标
            })
          }
          let isDieInHook = handleUnitDie({
            method:'hook',
            methodName:'hookConfig',
            hookConfig,
            before:targetHpBefore,
            value:targetHpBefore,
          },target,!isPlayer)
          if(!isDieInHook.next){
            result.next = false
            return result
          }
        }
      }
      
      if(unit.name==='路边王' && unit.hp <=0){
        // 玩家胜利
        gameData.combat.log.push({
          type: "info",
          text: `你击败了${gameData.combat.enemy.name}！`
        });

        updateCombatUI();
        // 延迟后关闭战斗
        setTimeout(() => {
          gameData.combat.active = false;
          gameData.currentEvent = unit.onDeath.event
          updateUI();
        }, 2000);
        result.next=false;
        return result
      }
      return result;
    }
    function runEnemyRoundAction() {
      gameData.combat.currentTurn = 'enemy'
      gameData.combat.totalRound++
      gameData.combat.enemyRoundNum++
      let startResult = startEnemyRound()
      if(!startResult.next){
        return
      }
      let theEnemy = gameData.combat.enemy
      if(!theEnemy.hasGotten1stRound){
        if(theEnemy.onFightStart){
          if(!runUnitHook(theEnemy.onFightStart,theEnemy,false).next){
            return
          }
        }
        theEnemy.hasGotten1stRound = true
      }
      if(theEnemy.onRoundStart){
        if(!runUnitHook(theEnemy.onRoundStart,theEnemy,false).next){
          return
        }
      }
      let enemyDamage = pickUnitAttack(theEnemy)
      let playerHpBefore = gameData.player.hp
      enemyDamage = hurtUnit(enemyDamage, gameData.player)
      gameData.player.hp -= enemyDamage;

      sumPlayer({
        sumType: 'hurt',
        hurtType: "normal",
        value: enemyDamage,
        isPlayerRound: false,
        source: theEnemy
      })

      gameData.combat.log.push({
        type: "enemy",
        text: `${theEnemy.name}对你造成了${enemyDamage}点伤害！`
      });

      let dieCheck = handleUnitDie({
        method:theEnemy.name || 'enemy',
        methodName:'enemy',
        enemy:theEnemy,
        before:playerHpBefore,
        value:playerHpBefore,
      },gameData.player,false)
      if(!dieCheck.next){
        return
      }
      
      let endResult = endEnemyRound()
      if(!endResult.next){
        return
      }
      

      updateCombatUI();

      // 敌方回合结算完毕 进入玩家方的下一回合
      setTimeout(()=>{
        gameData.combat.currentTurn = 'player'
        gameData.combat.totalRound++
        gameData.combat.enemyRoundNum++
        // 开始玩家回合
        startPlayerRound()
      },1000)
    }
    /**
     * 状态处理
     * @param {*} status 状态
     * @param {*} unit 单位
     * @param {*} isPlayer 是否是玩家方回合
    */
    function statusActions(status,unit,isPlayer=true){
      let result = {next:true}
      switch (status.id) {
        case 'poison': {
          let poisonDamage = hurtUnit(status.value,unit)
          status.value--
          let before = unit.hp;
          unit.hp -= poisonDamage
          // 战斗日志
          gameData.combat.log.push({
            type:isPlayer?'player':'enemy',
            text:`${isPlayer?'你':unit.name}${status.name}状态激发了,${poisonDamage?`受到${poisonDamage}点毒属性伤害！`:'但没有受到伤害！'}`
          })
          if(isPlayer){
            // 统计玩家收到的毒伤
            sumPlayer({
              sumType: 'hurt',
              hurtType: "poison",
              value: poisonDamage,
              isOutFight:false,
              isPlayerRound: true,
              source: status
            })
          }else{
            // 统计玩家造成的毒伤 // 目前仅考虑 中毒状态由敌对单位施加
            sumPlayer({
              sumType: 'damage',
              damageType: "poison", // 伤害类型
              value: poisonDamage, // 统计基准值
              isPlayerRound: true, // 是否是玩家回合
              target: unit, // 伤害目标
            })
          }
          if(!status.value){
            // 移除状态
            let index = unit.status.findIndex(m => m.id === 'poison')
            unit.status.splice(index,1)
          }
          let isNext = handleUnitDie({
            method:'poison',
            methodName:'status',
            status,
            before:before,
            value:before,
          },unit,isPlayer)
          if(!isNext.next){
            result.next = false
            return result;
          }
          break;
        }
      }
      return result
    }
    // 统一封装战斗中死亡的处理
    /**
     * @param {*} reason 死亡原因
     * @param {*} unit 死亡单位
     * @param {*} isPlayer 是否玩家回合
    */
    function handleUnitDie(reason,unit,isPlyaer){
      let result = {next:true}
      if (gameData.player.hp <= 0) {
        // 统计死亡
        sumPlayer({
          sumType: 'dead',
          stat_level: 'game',
          method: reason.method || 'enemy',
          [reason.methodName||'methodName']:JSON.parse(JSON.stringify(reason.methodInfo||null)),
          isOutFight: !gameData.combat.active,
          isPlayerRound: isPlyaer,
          enemy: JSON.parse(JSON.stringify(gameData.combat.enemy)),
          source:JSON.parse(JSON.stringify(gameData.combat.enemy)),
          before: reason.before,
          value: reason.value, // 致死伤害
          isCritic:reason.isCritic,
        })
        if(gameData.combat.active && gameData.combat.enemy.isBoss){
          // 被boss击败 游戏结束
          gameData.combat.log.push({
            type: "info",
            text: `你被${gameData.combat.enemy.name}击败了！`
          });

          updateCombatUI();
          // 延迟后关闭战斗
          setTimeout(() => {
            gameData.combat.active = false;
            gameData.currentEvent = {
              title: "你死了！",
              description: `你被BOSS单位${gameData.combat.enemy.name}击败了，故事终结！`,
              actions: [
                { text: "查看后续", type: "end:lose" },
              ].filter(Boolean)
            }
            updateUI();
          }, 2000);
          result.next = false
          return result
        }
        if(!reason.isOutFight){
          endCombat(false);
          result.next = false
        }
        result.die = gameData.player;
        return result;
      }else if(gameData.combat.active && gameData.combat.enemy.hp<=0){
          // 统计击杀
        sumPlayer({
          sumType: 'defeat',
          stat_level: 'game',
          method: reason.method || 'enemy',
          [reason.methodName||'methodName']:JSON.parse(JSON.stringify(reason.methodInfo||null)),
          isOutFight: !gameData.combat.active,
          isPlayerRound: isPlyaer,
          target: JSON.parse(JSON.stringify(gameData.combat.enemy)),
          before: reason.before,
          value: reason.value, // 致死伤害
          isCritic:reason.isCritic,
        })
        if(unit.onDeath){
          let hookResult = runUnitHook(unit.onDeath,unit,isPlyaer)
          if(!hookResult.next){
            result.next = false
            return result;
          }
        }
        if(!reason.isOutFight){
          endCombat(true);
          result.next = false
        }
        result.die = gameData.combat.enemy;
        return result;
      }
      return result
    };
    function pickUnitAttack(unit) {
      let base = unit.attack || 0
      let unitEquip = unit.equipment
      if (unitEquip && unitEquip.weapon) {
        base += unitEquip.weapon.attack || 0
      }

      let baseBig = unit.bigAttack || 0
      if (unitEquip && unitEquip.weapon) {
        baseBig += unitEquip.weapon.bigAttack || 0
      }
      base = base * (1 + baseBig / 100)

      return base;
    }
    function criticValue(value, unit) {
      let result = { isCritic: false, value }
      let rate = unit.criticalRate || 0
      if (unit.equipment && unit.equipment.accessory && unit.equipment.accessory.criticalRate) {
        rate += (unit.equipment.accessory.criticalRate || 0);
        result.isCritic = rpgRateCheck(rate);
        if (result.isCritic) {
          let sumUnitCriticalDamage = (unit.criticalDamage || 0) + (unit.equipment.accessory.criticalDamage || 0)
          result.value = value * (1 + (sumUnitCriticalDamage) / 100)
        }
      }
      return result
    }
    function unitLuanchDamage(unit) {

    }
    function pickUnitDefend(unit) {
      let base = unit.defend || 0
      let unitEquip = unit.equipment
      if (unitEquip && unitEquip.armor) {
        base += unitEquip.armor.defend || 0
      }
      let baseBig = unit.bigDefend || 0
      if (unitEquip && unitEquip.armor) {
        baseBig += unitEquip.armor.bigDefend || 0
      }
      base = base * (1 + baseBig / 100)

      return base;
    }
    function hurtUnit(damage, unit, overflow = true) {
      let defend = pickUnitDefend(unit);
      let afterDef = Math.max(1, damage - defend)
      if (overflow) {
        return afterDef; // 允许
      } else {
        let d = Math.min(unit.hp, afterDef) // 不允许溢出
        return d
      }
    }
    // 使用技能
    function useSkill(skill, isEnemy = false) {
      if (gameData.combat.active && gameData.combat.enemy) {
        let skillUnit = isEnemy ? gameData.combat.enemy : gameData.player;
        let oppoUnit = isEnemy ? gameData.player : gameData.combat.enemy;
        let roundOwner = isEnemy ? 'enemy' : 'player';
        let roundOwnerName = isEnemy ? skillUnit.name : '你';

        let costInfo = {}
        // 技能消耗
        if (skill.bigCost) {
          let bigCost = Math.min(100, skill.bigCost)
          switch (skill.costType) {
            case 'gold': {
              // 敌人没有金币 使用不了消耗金币的技能
              if (isEnemy) { return };
              let goldBefore = skillUnit.gold;
              let goldCost = Math.floor(bigCost / 100 * skillUnit.gold);
              skillUnit.gold -= goldCost;
              costInfo.goldCost = goldCost
              costInfo.goldBefore = goldBefore
              // 统计金币消耗
              sumPlayer({
                sumType: 'gold',
                method: 'skill',
                stat_level: 'game',
                changeType: 'decrease',
                value: goldCost,
                goldBefore,
                goldAfter: skillUnit.gold,
                isPlayerRound: true,
              })
              break;
            }
            case 'exp': {
              // 敌人没有经验 使用不了消耗经验的技能
              if (isEnemy) { return };
              let expBefore = skillUnit.exp;
              let expCost = Math.floor(bigCost / 100 * skillUnit.exp);
              skillUnit.exp -= expCost;
              costInfo.expCost = expCost
              costInfo.expBefore = expBefore
              // 统计金币消耗
              sumPlayer({
                sumType: 'exp',
                method: 'skill',
                stat_level: 'game',
                changeType: 'decrease',
                value: expCost,
                expBefore,
                goldAfter: skillUnit.exp,
                isPlayerRound: true,
              })
              break;
            }
          }
        } else if (skill.cost) {
          //  to do
        }

        if (skill.skillType === 'damage') {
          let skillDamage

          if (skill.damage) {
            // 伤害技能
            skillDamage = skill.damage;

          } else if (skill.bigAttackDamage) {
            // 伤害技能
            let weaponAttack = (skillUnit.equipment && skillUnit.equipment.weapon && skillUnit.equipment.weapon.attack) || 0
            skillDamage = Math.ceil(skill.bigAttackDamage / 100 * (skillUnit.attack + weaponAttack));

          } else if (skill.bigGoldDamage) {
            let goldValue = skillUnit.gold
            if(skill.costType==='gold'){
              goldValue = costInfo.goldBefore;
            }
            // 伤害技能
            skillDamage = skill.bigGoldDamage / 100 * goldValue;

          } else if (skill.bigEnemyMaxHpDamage) {

            skillDamage = Math.ceil(skill.bigEnemyMaxHpDamage / 100 * oppoUnit.maxHp);

          } else if (skill.randomDamage) {
            // 随机伤害
            skillDamage = Math.floor(Math.random() * skill.randomDamage + 1);

          } else {

            skillDamage = Math.floor(Math.random() * 5) + skillUnit.attack;

          }
          let criticResult = criticValue(skillDamage, skillUnit)
          let isCritic = criticResult.isCritic
          skillDamage = criticResult.value

          if(skill.damageType !== 'absolute'){
            skillDamage = hurtUnit(skillDamage, oppoUnit)
          }
          let oppoHpBefore = oppoUnit.hp
          oppoUnit.hp -= skillDamage;
          if (roundOwner === 'player') {
            sumPlayer({
              sumType: 'damage',
              damageType: skill.damageType || 'normal',
              value: skillDamage,
              isPlayerRound: true,
              target: gameData.combat.enemy
            });
          } else {
            sumPlayer({
              sumType: 'hurt',
              hurtType: skill.damageType || 'normal',
              value: skillDamage,
              isPlayerRound: false,
              source: gameData.combat.enemy,
            });
          }

          gameData.combat.log.push({
            type: roundOwner,
            text: `${isCritic ? '暴击了！' : ''}${roundOwnerName}使用了${skill.name}，对${oppoUnit.name}造成了${skillDamage}点伤害！`
          });

          // 检查敌人是否被击败
          let isNext = handleUnitDie({
            damgeType:skill.damegType||'normal',
            method:'skill',
            methodName:'skill',
            skill,
            before:oppoHpBefore,
            value:oppoHpBefore,
            isCritic,
          },oppoUnit,roundOwner !== 'player')
          if(!isNext.next){
            return
          }

          if (roundOwner === 'player') {
            
            let endResult = endPlayerRound()
            if(!endResult.next){
              return
            }
            // 敌人反击
            setTimeout(() => {
              runEnemyRoundAction()
            }, 1000);
          }
        } else if (skill.skillType === 'heal') {
          let healAmount;
          if (skill.heal) {

            healAmount = skill.heal;
          }
          else if (skill.bigHeal) {
            healAmount = Math.floor(skill.bigHeal / 100 * skillUnit.maxHp);
          } else {
            healAmount = Math.floor(Math.random() * 5) + 1
          }

          let criticResult = criticValue(healAmount, skillUnit)
          let isCritic = criticResult.isCritic
          healAmount = criticResult.value

          let oldHp = skillUnit.hp
          skillUnit.hp = Math.min(skillUnit.maxHp, skillUnit.hp + healAmount);
          if (roundOwner === 'player') {
            sumPlayer({
              sumType: 'heal',
              method: skill.name || 'skill',
              skill,
              healType: 'normal',
              isPlayerRound: true,
              source: gameData.player,
              fullValue: healAmount,
              value: skillUnit.hp - oldHp,

            });

          gameData.combat.log.push({
            type: "heal",
            text: `${roundOwnerName}使用了${skill.name}，${isCritic ? '暴击了！' : ''}恢复了${healAmount}点生命值！`
          });
          if (roundOwner === 'player') {
            
            let endResult = endPlayerRound()
            if(!endResult.next){

            }
            // 敌人反击
            setTimeout(() => {
              runEnemyRoundAction()

          }
        } 
        else if(skill.skillType==='mpRecover'){ // 恢复魔法值的技能
          let mpBefore = skillUnit.mp||0
          let recoverAmount;
          if(skill.recover){

          }

          if(!isEnemy){
            sumPlayer({
              sumType:'mp',
              method:'skill',
              skill:skill,
              changeType:'increase',
              isOutFight:false,
              isPlayerRound:true,
              before:mpBefore,
              value:skillUnit.mp - mpBefore,
            })
          }

        else if(skill.skillType==='rule'){

            })
            updateCombatUI()

            if (roundOwner === 'player') {
              
              let endResult = endPlayerRound()
              if(!endResult.next){
                return
              }
              // 敌人反击
              setTimeout(() => {
                runEnemyRoundAction()
              }, 1000);
            }
          }
        }else if(skill.skillType==='bless'){
          switch(skill.blessType){
            case 'hook':{
              if(!skillUnit[skill.hook]){
                skillUnit[skill.hook]={};
              }
              let theUnitSkillHook = skillUnit[skill.hook]
              if(skill.hpRecover){
                theUnitSkillHook.hpRecover = (theUnitSkillHook.hpRecover||0) + skill.hpRecover;
              }
              gameData.combat.log.push({
                type:roundOwner,
                text:`${roundOwner === 'player'?'你':skillUnit.name}使用了技能${skill.name}！`
              })
              if(roundOwner === 'player'){
                endPlayerRound()
                setTimeout(()=>{
                  runEnemyRoundAction()
                },1000)
              }else{
                endEnemyRound()
                setTimeout(()=>{
                  startPlayerRound()
                },1000)
              }
              break;
            }
          }
        }

        updateCombatUI();
      }
    }

    // 结束战斗
    function endCombat(playerWon) {
      if(gameData.combat.isPlayerRound){
        if(gameData.player.onFightEnd && !gameData.player.hasRunFightEnd){
          if(!runUnitHook(gameData.player.onFightEnd,gameData.player,gameData.combat.isPlayerRound).next){
            return
          }

        if(gameData.combat.enemy.onFightEnd && !gameData.combat.enemy.hasRunFightEnd){
          if(!runUnitHook(gameData.combat.enemy.onFightEnd,gameData.combat.enemy,gameData.combat.isPlayerRound).next){
            return
          }
        }
      }else{
        if(gameData.combat.enemy.onFightEnd && !gameData.combat.enemy.hasRunFightEnd){
          if(!runUnitHook(gameData.combat.enemy.onFightEnd,gameData.combat.enemy,gameData.combat.isPlayerRound).next){
            return
          }
        }
        if(gameData.player.onFightEnd && !gameData.player.hasRunFightEnd){
          if(!runUnitHook(gameData.player.onFightEnd,gameData.player,gameData.combat.isPlayerRound).next){
            return
          }

      if (playerWon) {
