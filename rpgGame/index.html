    // 检查并处理升级
    function handleLevelUp() {
      if (gameData.player.exp >= gameData.player.nextLevelExp) {
        // 升级自然增长攻防生命值
        let attackBefore = gameData.player.attack
        let defendBefore = gameData.player.defend
        let maxHpBefore = gameData.player.maxHp
        let hpBefore = gameData.player.hp

        gameData.player.attack++
        gameData.player.defend++
        gameData.player.maxHp++;
        gameData.player.hp++
        let tool = [
          ['attack', attackBefore, gameData.player.attack],
          ['defend', defendBefore, gameData.player.defend],
          ['maxHp', maxHpBefore, gameData.player.maxHp],
          ['hp', hpBefore, gameData.player.hp]
        ];
        tool.forEach(([prop, before, after]) => {
          sumPlayer({
            sumType: 'prop',
            stat_level: 'game',
            prop: prop,
            changeType: 'increase',
            before,
            value: after - before,
            method: 'levelUp',
          })
        });

        setTimeout(showLevelUpModal, 1500);
      }
    }
    // 显示升级模态框
    function showLevelUpModal() {
      elements.newLevel.textContent = gameData.player.level + 1;
      elements.levelupModal.style.display = 'flex';
    }

    // 选择升级奖励
    function selectLevelUpReward(type) {
      gameData.player.level++;
      let gains = [];
      switch (type) {
        case 'hp': {
          let hpReward = Math.max(Math.ceil(gameData.player.maxHp * 0.05),3);
          let maxHpBefore = gameData.player.maxHp
          let hpHpBefore = gameData.player.hp
          gameData.player.maxHp += hpReward;
          gameData.player.hp += hpReward;
          // 统计最大生命值 和 生命值 
          sumPlayer([{
            sumType: 'prop',
            stat_level: 'game',
            prop: 'maxHp',
            changeType: 'increase',
            method: 'levelUp',
            level: gameData.player.level,
            before: maxHpBefore,
            value: gameData.player.maxHp - maxHpBefore
          },{
            sumType: 'prop',
            stat_level: 'game',
            prop: 'hp',
            changeType: 'increase',
            method: 'levelUp',
            level: gameData.player.level,
            before: hpHpBefore,
            value: gameData.player.hp - hpHpBefore
          }]);
          gains.push(`生命值上升${hpReward}点！`)
          break;
        }
        case 'attack': {
          let attackBefore = gameData.player.attack;
          gameData.player.attack += Math.floor(Math.random()*8)+3;
          let delta = gameData.player.attack - attackBefore;
          // 统计攻击力
          sumPlayer({
            sumType: 'prop',
            stat_level: 'game',
            prop: 'attack',
            changeType: 'increase',
            method: 'levelUp',
            level: gameData.player.level,
            before: attackBefore,
            value: delta,
          })
          gains.push(`攻击力上升${delta}点！`)
          break;
        }
        case 'defend':{
          let defendBefore = gameData.player.defend;
          gameData.player.defend += Math.floor(Math.random()*8)+3;
          let delta = gameData.player.defend - defendBefore;
          // 统计防御力
          sumPlayer({
            sumType: 'prop',
            stat_level: 'game',
            prop: 'defend',
            changeType: 'increase',
            method: 'levelUp',
            level: gameData.player.level,
            before: defendBefore,
            value: delta,
          })
          gains.push(`防御力上升${delta}点！`)
          break;
        }
        case 'skill':
          // 从可用技能中随机选择一个新技能
          const availableSkills = gameData.lvupRewardSkills.filter(skill =>
            !gameData.player.skills.some(playerSkill => playerSkill.name === skill)
          );

          if (availableSkills.length > 0) {
            const newSkillName = availableSkills[Math.floor(Math.random() * availableSkills.length)];
            let newSkill = rpgGameSkillData.find(skill => skill.name === newSkillName);
            // 统计技能
            sumPlayer({
              sumType: 'skill',
              stat_level: 'game',
              method: 'levelUp',
              level: gameData.player.level,
              skill: newSkill,
            });
            gameData.player.skills.push(JSON.parse(JSON.stringify(newSkill)));
            gains.push(`获得新技能${newSkill.name}！`)
          } else {
            console.log("没有可用技能");
            let replacedReward = ['hp', 'defend', 'attack'][Math.floor(Math.random() * 3)]
            gameData.player[replacedReward] += 3
            gains.push(`没有可用技能！已自动转为3点${replacedReward === 'hp' ? '生命值' : replacedReward === 'defend' ? '防御力' : '攻击力'}！`)
          }
          break;
      }

      // 重置经验值
      gameData.player.exp = gameData.player.exp - gameData.player.nextLevelExp;
      gameData.player.nextLevelExp = Math.ceil(gameData.player.nextLevelExp * 1.1);
      elements.levelupModal.style.display = 'none';

      gameData.currentEvent.description += `你升到了${gameData.player.level}级！${gains.join('')}`

      updateUI();
      if (gameData.player.exp >= gameData.player.nextLevelExp) {
        return handleLevelUp()
      }
    }

    function compareEquipment(newEqp,oldEqp){
      const result = {new:0,old:0}
      let player = gameData.player;
      // 伤害方向
      let playerAttack = player.attack||0
      let playerBigAttack = player.bigAttack||0
      let playerCriticalRate = player.criticalRate||0
      let playerCriticalDamage = player.criticalDamage||0
      // 当前武器下 玩家的基础攻击期望
      // 大小攻击 暴击率暴击伤害期望  = 暴击率 * ( 1 + 爆伤比率 )
      let newDamageExpect = calcDamageMathExpect({
        attack:playerAttack + newEqp.attack||0,
        bigAttack:playerBigAttack + newEqp.bigAttack||0,
        criticalRate:playerCriticalRate + newEqp.criticalRate||0,
        criticalDamage:playerCriticalDamage + newEqp.criticalDamage||0,
      })
      let oldDamageExpect = calcDamageMathExpect({
        attack:playerAttack + oldEqp.attack||0,
        bigAttack:playerBigAttack + oldEqp.bigAttack||0,
        criticalRate:playerCriticalRate + oldEqp.criticalRate||0,
        criticalDamage:playerCriticalDamage + oldEqp.criticalDamage||0,
      })
      // 比较与计分 攻击期望提升幅度百分比
      let betterAttackOne = newDamageExpect > oldDamageExpect 
        ? ((result.new += Math.ceil((newDamageExpect - oldDamageExpect) / oldDamageExpect * 100) / 100),newEqp) 
        : oldDamageExpect > newDamageExpect
          ? ((result.old += Math.ceil((oldDamageExpect - newDamageExpect) / newDamageExpect * 100) / 100),oldEqp)
          : null;
      // 防御方向
      let playerDefend = player.defend||0
      let playerBigDefend = player.bigDefend||0
      let playerDodgeRate = player.dodgeRate||0
      let newDefendExpect = calcDefendMathExpect({
        defend:playerDefend + newEqp.defend||0,
        bigDefend:playerBigDefend + newEqp.bigDefend||0,
        dodgeRate:playerDodgeRate + newEqp.dodgeRate||0,
      })
      let oldDefendExpect = calcDefendMathExpect({
        defend:playerDefend + oldEqp.defend||0,
        bigDefend:playerBigDefend + oldEqp.bigDefend||0,
        dodgeRate:playerDodgeRate + oldEqp.dodgeRate||0,
      })
      // 防御比较与计分 承伤期望降幅百分比 
      let betterDefendOne = newDefendExpect < oldDefendExpect 
        ? ((result.new += Math.ceil((oldDefendExpect - newDefendExpect) / newDefendExpect * 100) / 100),newEqp)  
        : oldDefendExpect < newDefendExpect
          ? ((result.old += Math.ceil((newDamageExpect - oldDefendExpect) / oldDefendExpect * 100) / 100),oldEqp)
          : null;
      // 其他属性比较
      switch(newEqp.damageType){
        case 'absolute':{
          result.new +=5; // 绝对伤害 加 5 分
          break;
        }
        // 普通类型不加分
        case undefined:{}
        case 'normal':{break;}
        default:{
          result.new +=1 // 属性伤害 加 1 分
          break;
        }
      }
      if(newEqp.hpRecover){// 行动回血加成
        result.new += 2
      }
      if(newEqp.attackHpRecover){// 攻击回血加成
        result.new += 1
      }
      if(newEqp.attackStatus){// 攻击额外状态
        result.new += 1
      }
      if(newEqp.attackEffects && newEqp.attackEffects.length){
        result.new += newEqp.attackEffects.length
      }
      switch(oldEqp.damageType){
        case 'absolute':{
          result.old +=5; // 绝对伤害 加 5 分
          break;
        }
        // 普通类型不加分
        case undefined:{}
        case 'normal':{break;}
        default:{
          result.old +=1 // 属性伤害 加 1 分
          break;
        }
      }
      if(oldEqp.hpRecover){// 行动回血加成
        result.old += 2
      }
      if(oldEqp.attackHpRecover){// 攻击回血加成
        result.old += 1
      }
      if(oldEqp.attackStatus){// 攻击额外状态
        result.old += 1
      }
      if(oldEqp.attackEffects && oldEqp.attackEffects.length){
        result.old += oldEqp.attackEffects.length
      }

      return result;
    };
    function calcDamageMathExpect(config={}){
      let value = 0
      if(config.attack){
        value = config.attack
      }
      if(config.bigAttack){
        value *= (1 + config.bigAttack/100)
      }
      if(config.criticalRate && config.criticDamage){
        value *= (1 + config.criticalRate/100 * config.criticDamage/100)
      }
      return value
    }
    /**
     * 计算防御单位的承伤期望
     * @param {*} config 配置参数
     * @param {*} relaDamage 参考伤害
    */
    function calcDefendMathExpect(config={},relaDamage=1e8){
      let value = 0
      if(config.defend){
        value = config.defend
      }
      if(config.bigDefend){
        value *= (1 + config.bigDefend/100)
      }
      if(config.dodgeRate){
        value = 
          // 闪避成功下
          0 * config.dodgeRate/100 +
          // 未闪避时 承伤 
          (relaDamage - value) * (1 - config.dodgeRate/100);
      }
      return value;
    }

    function compareSkill(newSkill,oldSkill){
      let result = {new:0,old:0}
      if(newSkill.name===oldSkill.name && !newSkill.isUnico){
        // 同名非独一无二的技能 皆来自引用 完全相同
        return result
      }
      if(newSkill.skillType!==oldSkill.skillType){
        // 一般地认为这种情况不存在
        result.another = true; // 技能类型不同认为是全新的技能 执行添加
        return result
      }
      switch(newSkill.skillType){
        case 'damage':{
          damageProps.forEach(pn=>{
            let name = pn.prop
            if((newSkill[name]||0)>(oldSkill[name]||0)){
              // 固定伤害技能 数值更高加一分 
              // 随机伤害技能 数值更高加0.5分
              // 比率伤害技能 数值更高加2分
              result.new += (
                name==='damage'
                  ? 1
                  : name==='random'
                    ? 0.5
                    : 2
              );
            }else{
              // 否则给旧技能加分
              result.old += (
                name==='damage'
                  ? 1
                  : name==='random'
                    ? 0.5
                    : 2
              );
            }
          })
          break;
        }
        case 'heal':{
          healProps.forEach(pn=>{
            let name = pn.prop
            if((newSkill[name]||0)>(oldSkill[name]||0)){
              // 固定恢复技能 数值更高加一分 
              // 随机恢复技能 数值更高加0.5分
              // 比率恢复技能 数值更高加2分
              result.new += (
                name==='heal'
                  ? 1
                  : name==='random'
                    ? 0.5
                    : 2
              );
            }else{
              // 否则给旧技能加分
              result.old += (
                name==='heal'
                  ? 1
                  : name==='random'
                    ? 0.5
                    : 2
              );
            }
          })
          break;
        }
        case 'mpRecover':{
          mpRecoverProps.forEach(pn=>{
            let name = pn.prop
            if((newSkill[name]||0)>(oldSkill[name]||0)){
              // 固定恢复技能 数值更高加一分 
              // 随机恢复技能 数值更高加0.5分
              // 比率恢复技能 数值更高加2分
              result.new += (
                name==='recover'
                  ? 1
                  : name==='random'
                    ? 0.5
                    : 2
              );
            }else{
              // 否则给旧技能加分
              result.old += (
                name==='recover'
                  ? 1
                  : name==='random'
                    ? 0.5
                    : 2
              );
            }
          })
          break;
        }
        case 'status':{
          if(newSkill.status.value > oldSkill.status.value){
            result.new += 2
          }else{
            result.old += 2
          }
          break;
        }
        case 'rule':{

          break;
        }
        case 'bless':{

          break;
        }
      }
      // bigAttackDamage,bigGoldDamage,bigEnemyMaxHpDamage > damage,randomDamage
      // absolute > attr > normal
      // bigHeal > heal
      // bigRecover > recover
      return result
    };

    // 保存游戏到本地存储
    function saveGame(type = 'local') {
      try {
        const saveData = JSON.stringify(gameData);

        if (type === 'local') {
          localStorage.setItem('rpgGameSave', saveData);
          showNotification('游戏已保存到本地存储！');
        } else {
          // 导出操作
          currentSaveOperation = 'export';
          elements.saveModalTitle.textContent = '导出存档';
          elements.saveTextarea.value = saveData;
          elements.saveTextarea.readOnly = true;
          elements.saveModal.style.display = 'flex';
        }
      } catch (error) {
        console.error('保存游戏失败:', error);
        showNotification('保存游戏失败！', true);
      }
    }
    // 从本地存储加载游戏
    function loadLocalSave() {
      try {
        const saveData = localStorage.getItem('rpgGameSave');

        if (saveData) {
          const parsedData = JSON.parse(saveData);

          // 更新游戏数据
          Object.assign(gameData, parsedData);
          updateUI();
          showNotification('游戏已从本地存储加载！');
        } else {
          showNotification('没有找到本地存档！', true);
        }
      } catch (error) {
        console.error('加载游戏失败:', error);
        showNotification('加载游戏失败！', true);
      }
    }

    // 导出存档
    function exportSave() {
      saveGame('export');
    }

    // 导入存档
    function importSave() {
      currentSaveOperation = 'import';
      elements.saveModalTitle.textContent = '导入存档';
      elements.saveTextarea.value = '';
      elements.saveTextarea.placeholder = '请在此处粘贴存档JSON数据...';
      elements.saveTextarea.readOnly = false;
      elements.saveModal.style.display = 'flex';
    }

    // 复制存档到剪贴板
    function copySaveToClipboard() {
      try {
        const saveData = JSON.stringify(gameData);
        navigator.clipboard.writeText(saveData)
          .then(() => {
            showNotification('存档已复制到剪贴板！');
          })
          .catch(err => {
            console.error('复制失败:', err);
            showNotification('复制存档失败！', true);
          });
      } catch (error) {
        console.error('复制存档失败:', error);
        showNotification('复制存档失败！', true);
      }
    }

    // 从剪贴板粘贴存档
    function pasteSaveFromClipboard() {
      navigator.clipboard.readText()
        .then(text => {
          try {
            // 验证是否是有效的JSON
            JSON.parse(text);

            currentSaveOperation = 'import';
            elements.saveModalTitle.textContent = '导入存档';
            elements.saveTextarea.value = text;
            elements.saveTextarea.readOnly = false;
            elements.saveModal.style.display = 'flex';
          } catch (error) {
            showNotification('剪贴板内容不是有效的存档！', true);
          }
        })
        .catch(err => {
          console.error('读取剪贴板失败:', err);
          showNotification('读取剪贴板失败！', true);
        });
    }

    // 处理存档操作
    function handleSaveOperation() {
      try {
        if (currentSaveOperation === 'export') {
          // 导出操作 - 只需要关闭模态框
          elements.saveModal.style.display = 'none';
        } else if (currentSaveOperation === 'import') {
          // 导入操作 - 尝试解析存档数据
          const saveData = elements.saveTextarea.value;
          const parsedData = JSON.parse(saveData);

          // 更新游戏数据
          Object.assign(gameData, parsedData);
          updateUI();

          // 保存到本地存储
          localStorage.setItem('rpgGameSave', saveData);

          elements.saveModal.style.display = 'none';
          showNotification('存档导入成功！');
        }
      } catch (error) {
        console.error('存档操作失败:', error);
        showNotification('存档操作失败！', true);
      }
    }
    function clearLocalSave(){
      confirm('确定要清除本地存档吗？') && localStorage.removeItem('rpgGameSave')
    }

    // 显示通知
    function showNotification(message, isError = false) {
      elements.notificationText.textContent = message;
      elements.notification.style.background = isError
        ? 'rgba(231, 76, 60, 0.9)'
        : 'rgba(46, 204, 113, 0.9)';

      elements.notification.classList.add('show');

      setTimeout(() => {
        elements.notification.classList.remove('show');
      }, 3000);
    }
